# 安装 uv 后，将此配置加入自己的 Codex config.toml。
# @latest 在启动时检查 PyPI 上的最新兼容版本，Python 和依赖由 uv 管理。
[mcp_servers.image_generation]
command = "uvx"
args = ["codex-image-generation@latest"]
startup_timeout_sec = 120
tool_timeout_sec = 360
env_vars = []

# 按需在 env_vars 中填写 provider 引用的变量名称，不填写密钥值。
# 自定义 CODEX_HOME、CODEX_IMAGE_PROFILE、CODEX_IMAGE_TIMEOUT 时也需转发。
# 默认自动选择模型；固定偏好可转发 CODEX_IMAGE_RESPONSES_MODEL、CODEX_IMAGE_MODEL。
# CODEX_IMAGE_MODEL_POLICY 可设为 quality（默认）或 fast；无需设置即可使用。
# Codex 找不到 uvx 时，将 command 改为本机 uvx 的绝对路径。
