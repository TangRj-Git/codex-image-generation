name: 功能建议
description: 描述希望改进的图片生成或接入体验
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请从实际使用场景出发描述需求；不要附带密钥、完整配置或未经授权的图片。
        疑似漏洞请按仓库 SECURITY.md 私下报告。
  - type: textarea
    id: use_case
    attributes:
      label: 使用场景与当前困难
      description: 目前哪一步无法完成，或者使用起来不方便？
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 期望行为
      description: 可以给出一句希望对 Codex 说的话，以及期待保存或返回的结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的方法与补充信息
      description: 可附相关公开文档；请区分已验证能力与设想。
