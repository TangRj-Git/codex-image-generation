name: Test and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11"]
        include:
          - os: ubuntu-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked python -B -m unittest discover -s tests -v
      - run: uv run --locked python scripts/build_release.py
      - name: Test installed wheel outside source checkout
        shell: bash
        run: uv run --locked python scripts/smoke_wheel.py --wheel dist/*-py3-none-any.whl
