[project]
name = "codex-image-generation"
version = "0.3.0"
description = "A local Codex MCP server for Responses image generation using existing provider credentials"
readme = { file = "README_PYPI.md", content-type = "text/markdown" }
authors = [
    { name = "TangRuoJie", email = "3177065378@qq.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["codex", "mcp", "fastmcp", "image-generation", "responses"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "fastmcp>=4.1.4,<5",
    "openai>=3.42.0,<4",
    "httpx2>=2.16,<3",
    "pillow>=11.3,<14",
]

[project.scripts]
codex-image-generation = "codex_image_generation:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "codex_image_generation"
module-root = "src"
source-include = [
    "README.md",
    "README_PYPI.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "sunny-anime-puppy.png",
    "docs/*.md",
    "examples/*.toml",
    "scripts/*.py",
    "tests/*.py",
    "uv.lock",
    ".python-version",
]
source-exclude = [
    ".git", ".venv", ".env", ".env.*", "__pycache__", "*.pyc", "*.pyo",
    "/dist", "/build", "/outputs", "/src/**/*.png", "*.jpg", "*.jpeg", "*.webp",
]
