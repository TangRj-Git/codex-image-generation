[project]
name = "gpt-image-generation"
version = "0.1.0"
description = "A local Codex MCP server for Responses image generation using existing provider credentials"
readme = "README.md"
authors = [
    { name = "Administrator", email = "3177065378@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.1.4,<5",
    "openai>=3.42.0,<4",
    "pillow>=11.3,<14",
    "python-dotenv>=1.2.4",
]

[project.scripts]
gpt-image-generation = "gpt_image_generation:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
